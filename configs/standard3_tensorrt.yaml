#enemy_color: "red"
enemy_color: "blue"

#####----s-神经网络参数-----#####
# 推理后端选择：tensorrt | openvino
inference_backend: tensorrt

# 选择YOLO模型：yolov8 | yolo11
yolo_name: yolov8

classify_model: assets/tiny_resnet.onnx

# OpenVINO模型路径（备用）
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml

# TensorRT引擎路径（优先使用）
yolo11_engine_path: /home/spr/SPR_Vision_26/assets/engines/yolo11.engine
yolov8_engine_path: /home/spr/SPR_Vision_26/assets/engines/yolov8_repair.engine
yolo26_engine_path: /home/spr/SPR_Vision_26/assets/engines/best.engine
yolov5_engine_path: /home/spr/SPR_Vision_26/assets/engines/yolov5.engine

# TensorRT ONNX模型路径（如果engine不存在，会从ONNX构建）
yolov8_onnx_path: /home/spr/SPR_Vision_26/assets/engines/yolov8.onnx
yolo11_onnx_path: /home/spr/SPR_Vision_26/assets/yolo11.onnx
yolo26_onnx_path: /home/spr/SPR_Vision_26/assets/engines/yolo26.onnx
yolov5_onnx_path: /home/spr/SPR_Vision_26/assets/engines/0526.onnx
# TensorRT推理设备（GPU）
device: GPU

# 推理参数
min_confidence: 0.8
yolo_debug: false # YOLO调试可视化与截图开关（true时可能持续写入imgs）
use_traditional: false  # 是否启用传统方法（在神经网络基础上进行后处理）
use_async_inference: true  # 异步推理（可提升帧率，但有1帧延迟）


# 是否启用网页调试 (会增加额外开销，Orin上建议默认关闭)
enable_web_debug: true

# 网页调试端口
web_debug_port: 8080

# 是否启用 OpenCV 窗口显示（SSH/无桌面环境建议关闭）
enable_imshow: false

# PlotJuggler UDP 目标；Mac 上查看时填 Mac 的局域网 IP
plotter_host: "10.122.203.112"
plotter_port: 9870


#####-----ROI-----#####
roi:
  x: 420
  y: 100
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -2 # degree -2.5
pitch_offset: 1.0 # degree 2
comming_angle: 50 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.045 # s
low_speed_delay_time: 0.045 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----相机配置-----#####
camera_name: "hikrobot"
exposure_ms: 2.0
gain: 16.0
vid_pid: "2bdf:0001"

# camera_name: "mindvision"
# exposure_ms: 2.0
# gamma: 1.0
# vid_pid: "f622:d132"

debug: false

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----坐标系变换-----#####
#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.1820px
# camera_matrix: [1785.4881526822305, 0, 672.4806478241826, 0, 1785.026019470562, 559.89603224794314, 0, 0, 1]
# distort_coeffs: [-0.076005079619881746, 0.11182817466388446, 0.0005362204787722057, -0.0027546300984895122, 0]

# # 相机同理想情况的偏角: yaw1.44 pitch-7.28 roll0.96 degree
