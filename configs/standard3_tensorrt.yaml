# t_camera2gimbal: [0.13160669975045827, 0.10377721766577375, 0.024908271912914642]
# 重投影误差: 0.1283px
camera_matrix: [2405.2383864377525, 0, 719.1089470909925, 0, 2403.5790895626374, 562.29551387418564, 0, 0, 1]
distort_coeffs: [-0.026661205848656149, 0.1576357135322369, -0.00038445208738622529, 0.00015080298483983665, 0]
# 相机同理想情况的偏角: yaw-1.37 pitch-0.00 roll0.07 degree
# 标定板到世界坐标系原点的水平距离: 1.48 m
# 标定板同竖直摆放时的偏角: yaw160.78 pitch-2.14 roll90.39 degree
R_camera2gimbal: [0.023983001513958054, -8.20368612595831e-05, 0.99971236308667055, -0.99971165426405295, 0.0011916761626127859, 0.023983082298872877, -0.0011933008893547487, -0.99999928658868409, -5.3433235068305914e-05]
t_camera2gimbal: [0.15432862989955437, -0.044144795673841428, 0.048934941995976422]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 55
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s
