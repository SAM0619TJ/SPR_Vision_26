pattern_cols: 8
pattern_rows: 11
square_size_mm: 25  # 棋盘格方格边长（毫米）

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

#R_gimbal2imubody: [-1, 0,0,0, -1, 0, 0 , 0, 1]
# 相机内参矩阵（3×3，行优先）
# [fx, 0, cx, 0, fy, cy, 0, 0, 1]
# camera_matrix: [2807.679657, 0.000000, 954.251797, 0.000000, 2804.280283, 601.906719, 0.000000, 0.000000, 1.000000]

# # 相机畸变系数（5个参数）
# # [k1, k2, p1, p2, k3]
# distort_coeffs: [-0.250596, -0.395102, -0.001980, 0.001022, 0.000000]
# 重投影误差: 0.1283px
camera_matrix: [2405.2383864377525, 0, 719.1089470909925, 0, 2403.5790895626374, 562.29551387418564, 0, 0, 1]
distort_coeffs: [-0.026661205848656149, 0.1576357135322369, -0.00038445208738622529, 0.00015080298483983665, 0]


camera_name: "hikrobot"
exposure_ms: 3.1
gain: 24
vid_pid: "2bdf:0001"

#####-----串口配置（用于标定采集读取四元数）-----#####
# 串口设备（建议使用 udev 规则创建的稳定别名；必要时改为 /dev/ttyACM0 等）
com_port: "/dev/gimbal"
# 注意：该工程里 `io::Gimbal` 使用键名 `baud_rate`
baud_rate: 115200

#####-----CAN协议配置-----#####
new_can_quat_id: 0x150        # 四元数姿态帧ID
new_can_cmd_id: 0x170         # 自瞄指令帧ID
can_interface: "can0"
debug_rx: false
debug_tx: true